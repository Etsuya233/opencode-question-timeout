name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Confirm the packed tarball carries the terminal entrypoint
        run: |
          # OpenCode resolves a path-based plugin by looking for <plugin-dir>/tui
          # and ignores the exports map, so a tarball missing tui.ts would install
          # cleanly and then render nothing. Assert the packed contents.
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map(f => f.path);
            const required = ['tui.ts', 'index.ts', 'src/tui.tsx', 'src/question.ts'];
            const missing = required.filter(f => !files.includes(f));
            if (missing.length) {
              console.error('::error::missing from tarball: ' + missing.join(', '));
              process.exit(1);
            }
            const leaked = files.filter(f => /\.test\.tsx?$/.test(f));
            if (leaked.length) {
              console.error('::error::test files in tarball: ' + leaked.join(', '));
              process.exit(1);
            }
            console.log('tarball OK: ' + files.length + ' files');
          "
          rm -f pack.json

      - name: Verify sources stay LF
        # The package publishes the working tree, so CRLF would ship to npm.
        run: |
          if grep -rlU $'\r' --include='*.ts' --include='*.tsx' . --exclude-dir=node_modules; then
            echo "::error::CRLF line endings in published sources"
            exit 1
          fi
          echo "line endings OK"
